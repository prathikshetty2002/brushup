name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The dev tooling (vitest, jsdom, TypeScript 7) needs Node 22+; the shipped package is checked on 20.9 below.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:cjs
      - run: npm run check:types
      - name: Package contents are what we expect
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "dist/overlay.js" pack.txt
          ! grep -q "src/" pack.txt
      - name: Pack the tarball
        if: matrix.node == '24'
        run: npm pack
      - name: Keep the tarball for the Node 20 check
        if: matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: brushup-*.tgz

  # The canvas in real browsers: select, edit in the panel, drag, edit text and undo, checking each lands in the file.
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - run: node scripts/e2e-browser.mjs ${{ matrix.browser }}

  # Windows and macOS: the full pipeline plus the packed package, since paths, line endings and shells differ.
  cross-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:cjs
      - run: npm pack
      - run: node scripts/smoke.mjs (Get-ChildItem brushup-*.tgz | Select-Object -First 1).FullName
        if: runner.os == 'Windows'
        shell: pwsh
      - run: node scripts/smoke.mjs brushup-*.tgz
        if: runner.os != 'Windows'

  # The oldest Node the package claims (it is also Next 16's minimum): install the packed tarball and use it.
  node-20:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.9'
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - run: node scripts/smoke.mjs brushup-*.tgz

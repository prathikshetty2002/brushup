name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The dev tooling (vitest, jsdom, TypeScript 7) needs Node 22+; the shipped package is checked on 20.9 below.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:cjs
      - run: npm run check:types
      - name: Package contents are what we expect
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q "dist/overlay.js" pack.txt
          ! grep -q "src/" pack.txt
      - name: Pack the tarball
        if: matrix.node == '24'
        run: npm pack
      - name: Keep the tarball for the Node 20 check
        if: matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: brushup-*.tgz

  # The canvas in real browsers on each OS: select, edit in the panel, drag, edit text and undo, checking each lands in the file.
  browsers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browser: chromium }
          - { os: ubuntu-latest, browser: firefox }
          - { os: ubuntu-latest, browser: webkit }
          - { os: windows-latest, browser: chromium }
          - { os: windows-latest, browser: firefox }
          - { os: macos-latest, browser: chromium }
          - { os: macos-latest, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install ${{ matrix.browser }}
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Drive the canvas in ${{ matrix.browser }}
        run: node scripts/e2e-browser.mjs ${{ matrix.browser }}

  # Dev-server mode is where operating systems differ most (paths, the build loaders, the file watcher): build a real
  # Vite and a real Next.js app from the packed package, edit in a browser, and check the source file.
  dev-servers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, framework: vite, browser: chromium }
          - { os: ubuntu-latest, framework: next, browser: chromium }
          - { os: windows-latest, framework: vite, browser: chromium }
          - { os: windows-latest, framework: next, browser: chromium }
          - { os: windows-latest, framework: vite, browser: firefox }
          - { os: macos-latest, framework: vite, browser: chromium }
          - { os: macos-latest, framework: next, browser: chromium }
          - { os: macos-latest, framework: vite, browser: webkit }
          - { os: macos-latest, framework: next, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Install ${{ matrix.browser }}
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: ${{ matrix.framework }} dev server in ${{ matrix.browser }}
        run: node scripts/e2e-dev.mjs ${{ matrix.framework }} ${{ matrix.browser }}

  # Control for the Windows Vite failures: the same bare app with no Brushup at all.
  dev-server-control:
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - run: npx playwright-core install chromium
      - run: node scripts/e2e-dev.mjs vite chromium
        env:
          BRUSHUP_E2E_CONTROL: '1'

  # Windows and macOS: the full pipeline plus the packed package, since paths, line endings and shells differ.
  cross-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:cjs
      - run: npm pack
      - run: node scripts/smoke.mjs (Get-ChildItem brushup-*.tgz | Select-Object -First 1).FullName
        if: runner.os == 'Windows'
        shell: pwsh
      - run: node scripts/smoke.mjs brushup-*.tgz
        if: runner.os != 'Windows'

  # The oldest Node the package claims (it is also Next 16's minimum): install the packed tarball and use it.
  node-20:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.9'
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - run: node scripts/smoke.mjs brushup-*.tgz

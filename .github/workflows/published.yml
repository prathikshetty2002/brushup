name: Published package

# Installs what is on npm, not what is in the repo, on Linux, Windows and macOS, and runs the same checks as the packed-package smoke
# test (install, init, imports from CommonJS and ESM, the MCP server, serving a page), then builds a real Vite and a real Next.js
# app with it and edits through the panel in a browser. Run it by hand after `npm publish` (Actions tab, "Published package",
# Run workflow).

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'What to install (default: the latest release)'
        default: 'brushup@latest'

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.9', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke test the published package
        run: node scripts/smoke.mjs "${{ inputs.spec || 'brushup@latest' }}"

  # A real app on each OS with the published package: install, init, dev server, then select, edit in the panel, edit again and
  # undo in a browser, checking each lands in the source file.
  apps:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, framework: vite, browser: chromium }
          - { os: ubuntu-latest, framework: next, browser: chromium }
          - { os: windows-latest, framework: vite, browser: chromium }
          - { os: windows-latest, framework: next, browser: chromium }
          - { os: macos-latest, framework: vite, browser: chromium }
          - { os: macos-latest, framework: next, browser: chromium }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Make apt wait for its lock and give up on a stalled mirror
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' 'DPkg::Lock::Timeout "300";' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99brushup-ci >/dev/null
      - name: Install ${{ matrix.browser }}
        # The browser download is the other thing that stalls on a shared runner: give it a limit per attempt and retry.
        run: node scripts/with-retry.mjs 3 6 -- node node_modules/playwright-core/cli.js install --with-deps ${{ matrix.browser }}
      - name: ${{ matrix.framework }} app with the published package
        run: node scripts/with-retry.mjs 3 8 -- node scripts/e2e-dev.mjs ${{ matrix.framework }} ${{ matrix.browser }} "${{ inputs.spec || 'brushup@latest' }}"

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Brushup + Claude Code demo stage</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #0b0d12; color: #e6e8ec; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  #cap { position: absolute; left: 24px; right: 24px; top: 16px; height: 64px; display: flex; align-items: center; font-size: 27px; font-weight: 600; letter-spacing: -0.01em; opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s; }
  #cap.in { opacity: 1; transform: none; }
  #cap b { color: #60a5fa; font-weight: 700; margin-right: 12px; }
  #appwrap { position: absolute; left: 24px; top: 96px; width: 984px; height: 780px; border-radius: 12px; overflow: hidden; border: 1px solid #2c303a; background: #0d1017; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #app { width: 100%; height: 100%; border: 0; background: transparent; }
  #badge { position: absolute; left: 12px; bottom: 12px; background: rgba(15,17,21,.9); color: #cbd5e1; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #2c303a; pointer-events: none; }
  #meter { position: absolute; right: 12px; bottom: 12px; background: rgba(15,17,21,.92); color: #cbd5e1; font: 12px ui-monospace, monospace; padding: 5px 11px; border-radius: 999px; border: 1px solid #2c303a; pointer-events: none; transition: all .3s; }
  #meter.zero b { color: #4ade80; } #meter.busy b { color: #fbbf24; }
  #meter b { font-weight: 700; }
  .panel { position: absolute; left: 1032px; width: 544px; border-radius: 12px; border: 1px solid #2c303a; background: #0d1017; display: flex; flex-direction: column; overflow: hidden; }
  #term { top: 96px; height: 430px; }
  #src { top: 542px; height: 334px; background: #11141a; }
  .phead { padding: 9px 14px; border-bottom: 1px solid #232733; font-size: 12px; color: #8b93a1; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex: none; }
  .phead .dots { display: flex; gap: 6px; } .phead .dots i { width: 10px; height: 10px; border-radius: 50%; background: #2c303a; display: block; }
  .phead strong { color: #e6e8ec; font: 600 12.5px ui-monospace, 'SF Mono', Menlo, monospace; }
  #termbody { flex: 1; overflow: hidden; padding: 10px 14px; font: 12.5px/1.5 ui-monospace, 'SF Mono', Menlo, monospace; display: flex; flex-direction: column; justify-content: flex-end; }
  #termbody .l { white-space: pre-wrap; word-break: break-word; }
  .l.s { color: #4ade80; } .l.s::before { content: '$ '; color: #6b7280; }
  .l.o { color: #8b93a1; }
  .l.u { color: #93c5fd; } .l.u::before { content: '› '; color: #60a5fa; }
  .l.a { color: #e6e8ec; }
  .l.t { color: #fbbf24; } .l.t::before { content: '● '; color: #f59e0b; }
  .l.m { color: #c4b5fd; } .l.m::before { content: '● '; color: #a78bfa; }
  .l.r { color: #6b7280; padding-left: 16px; }
  .l.add { color: #86efac; padding-left: 16px; } .l.del { color: #fca5a5; padding-left: 16px; }
  .l.ok { color: #4ade80; }
  .cursor::after { content: '▋'; color: #9ca3af; animation: blink 1s steps(2) infinite; margin-left: 1px; }
  @keyframes blink { 50% { opacity: 0; } }
  #srcbody { flex: 1; overflow: hidden; padding: 8px 0; font: 12.5px/1.5 ui-monospace, 'SF Mono', Menlo, monospace; }
  .ln { display: flex; padding: 0 12px 0 0; white-space: pre-wrap; word-break: break-all; }
  .ln .n { width: 40px; flex: none; text-align: right; padding-right: 10px; color: #4b5563; user-select: none; }
  .ln .g { width: 14px; flex: none; }
  .ln.add { background: rgba(74,222,128,.13); color: #bbf7d0; } .ln.add .g { color: #4ade80; }
  .ln.del { background: rgba(248,113,113,.13); color: #fecaca; } .ln.del .g { color: #f87171; }
  .ln.same { color: #94a3b8; } .ln.gap { color: #4b5563; padding-left: 54px; }
  .empty { padding: 30px 24px; color: #6b7280; font: 13px/1.6 system-ui, sans-serif; }
  #card { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #151a26, #0b0d12 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity .5s; z-index: 50; }
  #card.on { opacity: 1; }
  #card h1 { font-size: 78px; margin: 0 0 18px; letter-spacing: -0.04em; } #card h1 i { font-style: normal; color: #60a5fa; }
  #card p { font-size: 28px; color: #9ca3af; margin: 0 0 8px; max-width: 1100px; line-height: 1.4; }
  #card ul { list-style: none; padding: 0; margin: 26px 0 0; font-size: 24px; color: #cbd5e1; line-height: 1.9; text-align: left; }
  #card li::before { content: '✓'; color: #4ade80; margin-right: 14px; font-weight: 700; }
  #cursor { position: absolute; left: 0; top: 0; width: 28px; height: 28px; pointer-events: none; z-index: 100; transform: translate(-100px,-100px); filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); transition: opacity .3s; }
  body.carded #cursor { opacity: 0; }
  .ripple { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 3px solid #60a5fa; pointer-events: none; z-index: 99; animation: rip .55s ease-out forwards; }
  @keyframes rip { to { transform: scale(4); opacity: 0; } }
</style>
</head>
<body>
  <div id="cap"></div>
  <div id="appwrap"><iframe id="app"></iframe><div id="badge">Next.js 16 · Tailwind · shadcn/ui</div><div id="meter" class="zero">Claude prompts: <b>0</b></div></div>
  <div id="term" class="panel">
    <div class="phead"><span class="dots"><i></i><i></i><i></i></span><strong id="termtitle">claude · my-app</strong><span></span></div>
    <div id="termbody"></div>
  </div>
  <div id="src" class="panel">
    <div class="phead"><span>Source changes</span><strong id="srcname"></strong></div>
    <div id="srcbody"></div>
  </div>
  <div id="card"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.7-7.8L21 10.5z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  window.setCaption = (step, text) => {
    const c = $('cap'); c.classList.remove('in'); void c.offsetWidth;
    c.innerHTML = step ? `<b>${esc(step)}</b>${esc(text)}` : esc(text); c.classList.add('in');
  };
  window.setApp = (url) => { $('app').src = url; };
  window.showCard = (html) => { $('card').innerHTML = html; $('card').classList.add('on'); document.body.classList.add('carded'); };
  window.hideCard = () => { $('card').classList.remove('on'); document.body.classList.remove('carded'); };
  window.moveCursor = (x, y) => { $('cursor').style.transform = `translate(${x - 4}px, ${y - 3}px)`; };
  window.ripple = (x, y) => { const r = document.createElement('div'); r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px'; document.body.appendChild(r); setTimeout(() => r.remove(), 700); };
  window.setMeter = (text, mode) => { const m = $('meter'); m.innerHTML = text; m.className = mode || ''; };

  /* ----- terminal ----- */
  const body = () => $('termbody');
  const trim = () => { while (body().children.length > 60) body().removeChild(body().firstChild); };
  window.termClear = () => { body().innerHTML = ''; };
  window.termTitle = (t) => { $('termtitle').textContent = t; };
  window.termLine = (kind, text) => { const d = document.createElement('div'); d.className = 'l ' + kind; d.textContent = text; body().appendChild(d); trim(); return d; };
  window.termType = async (kind, text, cps = 38) => {
    const d = window.termLine(kind, ''); d.classList.add('cursor');
    for (const ch of text) { d.textContent += ch; await sleep(1000 / cps); }
    d.classList.remove('cursor');
  };

  /* ----- source panel: live diff from the server, or a fixed snippet ----- */
  let override = null, last = '';
  const render = (name, lines) => {
    $('srcname').textContent = name || '';
    $('srcbody').innerHTML = lines.length
      ? lines.map((l) => l.kind === 'gap' ? `<div class="ln gap">⋯</div>` : `<div class="ln ${l.kind}"><span class="n">${l.n ?? ''}</span><span class="g">${l.kind === 'add' ? '+' : l.kind === 'del' ? '−' : ' '}</span><span>${esc(l.text)}</span></div>`).join('')
      : `<div class="empty">No source changes yet.<br>Everything you do on the canvas is written to your files; they show up here.</div>`;
  };
  window.setSnippet = (name, lines) => { override = { name, lines }; render(name, lines); };
  window.clearSnippet = () => { override = null; last = ''; };
  async function poll() {
    if (override) return;
    try {
      const s = await (await fetch('/api/source')).json();
      const key = JSON.stringify(s); if (key === last) return; last = key;
      render(s.name, s.lines);
    } catch {}
  }
  setInterval(poll, 200); poll();
</script>
</body>
</html>
